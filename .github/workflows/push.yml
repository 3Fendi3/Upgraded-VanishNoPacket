# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: On Push

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_upload:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: plugin
          path: target/VanishNoPacket-*.jar
      - name: Create Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha_short=$(git rev-parse --short HEAD)
          version=$(ls target/VanishNoPacket-*.jar | grep -o '[[:digit:]]\+\.[[:digit:]]\+')
          gh release create --draft "v$version+$sha_short" --title "$version: $sha_short"
          gh release upload "v$version+$sha_short" $(ls target/VanishNoPacket-*.jar)
          gh release edit "v$version+$sha_short" --draft=false
